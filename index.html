<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sinfonia dos Cristais</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Container principal 16:9 travado -->
  <main id="game-container">

    <!-- 1. PALAVRAS DO TÍTULO SEPARADAS (Sinfonia / dos / Cristais) -->
    <div id="title-layer">
      <button id="word-sinfonia" class="title-word" aria-label="Sinfonia">
        <span class="word-sprite"></span>
      </button>

      <button id="word-dos" class="title-word" aria-label="dos">
        <span class="word-sprite"></span>
      </button>

      <button id="word-cristais" class="title-word" aria-label="Cristais">
        <span class="word-sprite"></span>
      </button>
    </div>

    <!-- 2. CRISTAIS INTERATIVOS DA CAVERNA (Nenhum cristal da porta incluído) -->
    <div id="crystals-layer">
      <!-- Cristais colados nas laterais do título -->
      <button class="crystal-hitbox" data-note="0" style="left: 1.8%; top: 14.0%; width: 6.0%; height: 13.5%;" aria-label="Cristal do Título Esquerdo"></button>
      <button class="crystal-hitbox" data-note="1" style="left: 37.0%; top: 14.0%; width: 6.0%; height: 13.5%;" aria-label="Cristal do Título Direito"></button>

      <!-- Cristais do lado esquerdo da caverna -->
      <button class="crystal-hitbox" data-note="2" style="left: 43.2%; top: 6.8%; width: 6.2%; height: 13.5%;" aria-label="Cristais Superiores Esquerda"></button>
      <button class="crystal-hitbox" data-note="3" style="left: 48.0%; top: 34.5%; width: 4.3%; height: 9.8%;" aria-label="Cristal Rosa Parede Esquerda"></button>
      <button class="crystal-hitbox" data-note="4" style="left: 34.2%; top: 50.0%; width: 9.0%; height: 17.5%;" aria-label="Cristal Rosa Rocha Esquerda"></button>
      <button class="crystal-hitbox" data-note="5" style="left: 47.4%; top: 60.2%; width: 5.5%; height: 11.8%;" aria-label="Cristal Ciano Médio Esquerda"></button>
      <button class="crystal-hitbox" data-note="6" style="left: 50.0%; top: 77.2%; width: 4.5%; height: 9.0%;" aria-label="Cristal da Margem Esquerda"></button>
      <button class="crystal-hitbox" data-note="7" style="left: 8.8%; top: 83.5%; width: 7.4%; height: 16.0%;" aria-label="Cristal Inferior Esquerdo"></button>
      <button class="crystal-hitbox" data-note="8" style="left: 17.5%; top: 64.5%; width: 19.5%; height: 35.0%;" aria-label="Cristal Ciano Gigante Frontal"></button>

      <!-- Cristais do lado direito da caverna -->
      <button class="crystal-hitbox" data-note="9"  style="left: 89.2%; top: 25.0%; width: 8.5%; height: 17.5%;" aria-label="Cristais Superiores Direita"></button>
      <button class="crystal-hitbox" data-note="10" style="left: 84.8%; top: 53.0%; width: 9.0%; height: 17.0%;" aria-label="Cristal Ciano Médio Direita"></button>
      <button class="crystal-hitbox" data-note="11" style="left: 83.5%; top: 65.8%; width: 4.2%; height: 9.2%;" aria-label="Cristal Rosa Pequeno Direita"></button>
      <button class="crystal-hitbox" data-note="12" style="left: 81.2%; top: 80.5%; width: 6.2%; height: 11.5%;" aria-label="Cristais na Água Direita"></button>
      <button class="crystal-hitbox" data-note="13" style="left: 91.8%; top: 50.5%; width: 8.2%; height: 44.0%;" aria-label="Cristal Rosa Gigante Direita"></button>
    </div>

    <!-- Botão discreto para ver/ocultar as caixas de clique no telemóvel -->
    <button id="btn-debug-mobile" title="Mostrar/Ocultar Áreas de Clique">🔧</button>

  </main>

  <script src="script.js"></script>
</body>
</html>
